version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: portal_capacitaciones_db
    environment:
      POSTGRES_DB: portal_capacitacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - portal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for file storage
  minio:
    image: minio/minio:latest
    container_name: portal_capacitaciones_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - portal_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Create MinIO bucket
  minio-init:
    image: minio/mc:latest
    container_name: portal_capacitaciones_minio_init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/media --ignore-existing;
      /usr/bin/mc anonymous set public myminio/media;
      exit 0;
      "
    networks:
      - portal_network

  # Mailhog for email testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: portal_capacitaciones_mailhog
    ports:
      - "1025:1025"  # SMTP
      - "8025:8025"  # Web UI
    networks:
      - portal_network

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_capacitaciones_backend
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      # Database
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: portal_capacitacion
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_HOST: db
      DB_PORT: 5432
      
      # Django
      SECRET_KEY: django-insecure-docker-key-change-in-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      
      # JWT
      JWT_ACCESS_TOKEN_LIFETIME: 30
      JWT_REFRESH_TOKEN_LIFETIME: 7
      JWT_AUTH_HEADER_TYPE: Bearer
      
      # CORS
      CORS_ALLOW_ALL: "True"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      
      # MinIO
      MINIO_ENABLED: "True"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: media
      MINIO_REGION: us-east-1
      MINIO_ADDRESSING_STYLE: path
      
      # Email (Mailhog)
      USE_MAILHOG: "True"
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      DEFAULT_FROM_EMAIL: no-reply@portalcapacitaciones.com
    volumes:
      - ./backend:/app
      - backend_media:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - portal_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # React Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: portal_capacitaciones_frontend
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_APP_NAME=Portal de Capacitaciones
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - portal_network

volumes:
  postgres_data:
    driver: local
  minio_data:
    driver: local
  backend_media:
    driver: local

networks:
  portal_network:
    driver: bridge
