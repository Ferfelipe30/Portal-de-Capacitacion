version: '3.8'

# Docker Compose para desarrollo con hot-reload
services:
  db:
    image: postgres:16-alpine
    container_name: portal_capacitaciones_db_dev
    environment:
      POSTGRES_DB: portal_capacitacion
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - portal_network_dev
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: portal_capacitaciones_minio_dev
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data_dev:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - portal_network_dev
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-init:
    image: minio/mc:latest
    container_name: portal_capacitaciones_minio_init_dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin123;
      /usr/bin/mc mb myminio/media --ignore-existing;
      /usr/bin/mc anonymous set public myminio/media;
      exit 0;
      "
    networks:
      - portal_network_dev

  mailhog:
    image: mailhog/mailhog:latest
    container_name: portal_capacitaciones_mailhog_dev
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - portal_network_dev

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: portal_capacitaciones_backend_dev
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DB_ENGINE: django.db.backends.postgresql
      DB_NAME: portal_capacitacion
      DB_USER: postgres
      DB_PASSWORD: postgres_password
      DB_HOST: db
      DB_PORT: 5432
      SECRET_KEY: django-insecure-docker-dev-key
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1,backend
      JWT_ACCESS_TOKEN_LIFETIME: 30
      JWT_REFRESH_TOKEN_LIFETIME: 7
      JWT_AUTH_HEADER_TYPE: Bearer
      CORS_ALLOW_ALL: "True"
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      MINIO_ENABLED: "True"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin123
      MINIO_BUCKET_NAME: media
      MINIO_REGION: us-east-1
      MINIO_ADDRESSING_STYLE: path
      USE_MAILHOG: "True"
      MAILHOG_HOST: mailhog
      MAILHOG_PORT: 1025
      DEFAULT_FROM_EMAIL: no-reply@portalcapacitaciones.com
    volumes:
      - ./backend:/app
      - backend_media_dev:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailhog:
        condition: service_started
    networks:
      - portal_network_dev

  # Frontend con Vite dev server (hot-reload)
  frontend-dev:
    image: node:20-alpine
    container_name: portal_capacitaciones_frontend_dev
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_APP_NAME=Portal de Capacitaciones
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - portal_network_dev

volumes:
  postgres_data_dev:
    driver: local
  minio_data_dev:
    driver: local
  backend_media_dev:
    driver: local

networks:
  portal_network_dev:
    driver: bridge
