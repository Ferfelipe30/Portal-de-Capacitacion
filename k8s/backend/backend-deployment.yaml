apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: portal-capacitaciones
  labels:
    app: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: backend
          image: your-registry/portal-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: SECRET_KEY
            - name: DB_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_NAME
            - name: DB_ENGINE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_ENGINE
            - name: DB_HOST
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DB_PORT
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DB_PASSWORD
            - name: DEBUG
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DEBUG
            - name: ALLOWED_HOSTS
              value: "*"
            - name: JWT_ACCESS_TOKEN_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: JWT_ACCESS_TOKEN_LIFETIME
            - name: JWT_REFRESH_TOKEN_LIFETIME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: JWT_REFRESH_TOKEN_LIFETIME
            - name: JWT_AUTH_HEADER_TYPE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: JWT_AUTH_HEADER_TYPE
            - name: CORS_ALLOW_ALL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CORS_ALLOW_ALL
            - name: CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: CORS_ALLOWED_ORIGINS
            - name: MINIO_ENABLED
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MINIO_ENABLED
            - name: MINIO_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MINIO_ENDPOINT
            - name: MINIO_BUCKET_NAME
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MINIO_BUCKET_NAME
            - name: MINIO_REGION
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MINIO_REGION
            - name: MINIO_ADDRESSING_STYLE
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: MINIO_ADDRESSING_STYLE
            - name: MINIO_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_ACCESS_KEY
            - name: MINIO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: MINIO_SECRET_KEY
            - name: USE_MAILHOG
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: USE_MAILHOG
            - name: MAILHOG_HOST
              value: mailhog
            - name: MAILHOG_PORT
              value: "1025"
            - name: EMAIL_HOST
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST
            - name: EMAIL_PORT
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_PORT
            - name: EMAIL_USE_TLS
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_USE_TLS
            - name: EMAIL_HOST_USER
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_USER
            - name: EMAIL_HOST_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: EMAIL_HOST_PASSWORD
            - name: DEFAULT_FROM_EMAIL
              valueFrom:
                configMapKeyRef:
                  name: backend-config
                  key: DEFAULT_FROM_EMAIL
          volumeMounts:
            - name: media
              mountPath: /app/media
          readinessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
      volumes:
        - name: media
          persistentVolumeClaim:
            claimName: backend-media-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: backend-media-pvc
  namespace: portal-capacitaciones
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
